name: Dictee TTS

on:
  workflow_dispatch:
    inputs:
      dictee_id:
        required: true
        type: string
      text:
        required: true
        type: string
      voices:
        required: false
        default: "default"
        type: string
        description: "CSV list, e.g. male,female or explicit Google voice IDs (fr-FR-Neural2-*)"
      speeds:
        required: false
        default: "1.0"
        type: string
        description: "CSV list, e.g. 0.9,1.0,1.1"

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (for provenance)
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip

      # --- Authenticate to Google Cloud using the service account JSON stored in a secret ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-texttospeech

      # --- Generate MP3(s) with Google Cloud Text-to-Speech and upload them back to Django ---
      - name: Generate (Google TTS) + upload
        env:
          UPLOAD_URL: ${{ secrets.ALF_TTS_UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.ALF_TTS_UPLOAD_TOKEN }}
          DICTEE_ID: ${{ inputs.dictee_id }}
          TEXT: ${{ inputs.text }}
          VOICES: ${{ inputs.voices }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os, re, subprocess
          from google.cloud import texttospeech

          dictee_id = os.environ["DICTEE_ID"]
          text = os.environ.get("TEXT","").strip()
          voices_in = os.environ.get("VOICES","default")
          speeds_in = os.environ.get("SPEEDS","1.0")

          voices = [v.strip() for v in voices_in.split(",") if v.strip()]
          speeds = [s.strip() for s in speeds_in.split(",") if s.strip()]

          if not voices:
            voices = ["default"]
          if not speeds:
            speeds = ["1.0"]

          client = texttospeech.TextToSpeechClient()

          # Default label -> pinned Google voice mapping (edit to taste)
          LABEL_TO_VOICE = {
            "male":    "fr-FR-Neural2-D",
            "female":  "fr-FR-Neural2-F",
            "neutral": "fr-FR-Neural2-E",
            "default": "fr-FR-Neural2-D",
          }

          def to_ssml(t: str) -> str:
            t = t.strip()
            t = t.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
            # teacher-like pause after sentence punctuation
            t = re.sub(r'([.!?])\s+', r'\1 <break time="250ms"/> ', t)
            return f"<speak>{t}</speak>"

          ssml = to_ssml(text)

          def resolve_voice(vlabel: str):
            # if user passed explicit named voice (contains '-'), use it
            if "-" in vlabel:
              return texttospeech.VoiceSelectionParams(language_code="fr-FR", name=vlabel)
            chosen = LABEL_TO_VOICE.get(vlabel.lower(), LABEL_TO_VOICE["default"])
            return texttospeech.VoiceSelectionParams(language_code="fr-FR", name=chosen)

          for raw_voice in voices:
            voice_label = raw_voice.strip()
            if not voice_label:
              continue
            voice_param = resolve_voice(voice_label)

            for raw_speed in speeds:
              try:
                speaking_rate = float(raw_speed)
              except:
                speaking_rate = 1.0

              # clamp to safe Google limits
              if speaking_rate < 0.5: speaking_rate = 0.5
              if speaking_rate > 2.0: speaking_rate = 2.0

              audio_config = texttospeech.AudioConfig(
                audio_encoding=texttospeech.AudioEncoding.MP3,
                speaking_rate=speaking_rate,
              )

              response = client.synthesize_speech(
                input=texttospeech.SynthesisInput(ssml=ssml),
                voice=voice_param,
                audio_config=audio_config,
              )

              safe_voice = voice_label.replace("/", "_").replace(" ", "_")
              out_name = f"dictee_{dictee_id}_{safe_voice}_x{speaking_rate}.mp3"
              with open(out_name, "wb") as f:
                f.write(response.audio_content)
              print("Wrote", out_name)

              # Upload using same contract as before
              curl_cmd = [
                "curl", "-s", "-X", "POST",
                os.environ["UPLOAD_URL"],
                "-H", f"Authorization: Bearer {os.environ['UPLOAD_TOKEN']}",
                "-F", f"dictee_id={dictee_id}",
                "-F", f"voice={voice_label}",
                "-F", f"speed={speaking_rate}",
                "-F", f"file=@{out_name}",
              ]
              print("Uploading", out_name)
              subprocess.check_call(curl_cmd)
          PY
