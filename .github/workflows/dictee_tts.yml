name: Dictee TTS

on:
  workflow_dispatch:
    inputs:
      dictee_id:
        required: true
        type: string
      text:
        required: true
        type: string
      voice:
        default: "default"
        type: string
      speed:
        default: "1.0"
        type: string

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Debug start
        run: |
          echo "Starting Dictee TTS workflow"
          echo "Text: ${{ inputs.text }}"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip ffmpeg

      - name: Download Piper
        run: |
          set -x
          curl -L https://github.com/rhasspy/piper/releases/latest/download/piper_linux_x86_64.zip -o piper.zip
          unzip -q piper.zip -d piper
          chmod +x piper/piper

      - name: Download French voice
        run: |
          set -x
          mkdir -p voices
          curl -L https://github.com/rhasspy/piper/releases/latest/download/fr_FR-upmc-medium.onnx -o voices/fr.onnx
          curl -L https://github.com/rhasspy/piper/releases/latest/download/fr_FR-upmc-medium.onnx.json -o voices/fr.onnx.json

      - name: Generate audio (non-fatal)
        continue-on-error: true
        run: |
          set -x
          echo "${{ inputs.text }}" | ./piper/piper -m voices/fr.onnx -f dictee.wav
          ffmpeg -y -i dictee.wav dictee.mp3
          ls -lh dictee.*

      - name: Upload to backend (ALWAYS RUN)
        run: |
          set -x
          echo "UPLOAD_URL=${{ secrets.ALF_TTS_UPLOAD_URL }}"
          ls -lh dictee.mp3 || echo "⚠️ dictee.mp3 missing"

          curl -v -X POST "${{ secrets.ALF_TTS_UPLOAD_URL }}" \
            -H "Authorization: Bearer ${{ secrets.ALF_TTS_UPLOAD_TOKEN }}" \
            -F "dictee_id=${{ inputs.dictee_id }}" \
            -F "voice=${{ inputs.voice }}" \
            -F "speed=${{ inputs.speed }}" \
            -F "file=@dictee.mp3"
