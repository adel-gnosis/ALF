name: Dictee TTS (Google Cloud)

on:
  workflow_dispatch:
    inputs:
      dictee_id:
        required: true
        type: string
      text:
        required: true
        type: string
      voices:
        required: false
        default: "male_default,male_slow,female_default,female_rhythm"
        type: string
        description: "Canonical variant labels (backend sends these)."
      speeds:
        required: false
        default: ""
        type: string
        description: "Optional override CSV (if empty, each variant uses its default speed)."

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-texttospeech

      - name: Generate (Google TTS) + upload (4 canonical variants)
        env:
          UPLOAD_URL: ${{ secrets.ALF_TTS_UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.ALF_TTS_UPLOAD_TOKEN }}
          DICTEE_ID: ${{ inputs.dictee_id }}
          TEXT: ${{ inputs.text }}
          VARIANTS: ${{ inputs.voices }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os, re, subprocess
          from google.cloud import texttospeech

          dictee_id = os.environ["DICTEE_ID"]
          text = (os.environ.get("TEXT") or "").strip()
          variants_in = os.environ.get("VARIANTS") or ""
          speeds_in = os.environ.get("SPEEDS") or ""

          if not text:
              raise SystemExit("TEXT input is empty")

          # variants = CSV labels: e.g. male_default,male_slow,female_default,female_rhythm
          variants = [v.strip() for v in variants_in.split(",") if v.strip()]
          if not variants:
              variants = ["male_default","male_slow","female_default","female_rhythm"]

          # speeds override (CSV). If empty, we use each variant's default speed only.
          speeds_override = [s.strip() for s in speeds_in.split(",") if s.strip()]

          client = texttospeech.TextToSpeechClient()

          def escape_xml(s: str) -> str:
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def ssml_default(t: str) -> str:
              return f"<speak>{escape_xml(t)}</speak>"

          def ssml_slow_teacher(t: str) -> str:
              # longer breaks after sentences
              x = escape_xml(t)
              x = re.sub(r'([.!?])\s+', r'\1 <break time="400ms"/> ', x)
              return f"<speak>{x}</speak>"

          def ssml_rhythm(t: str) -> str:
              # medium breaks after sentences (rhythmic cadence)
              x = escape_xml(t)
              x = re.sub(r'([.!?])\s+', r'\1 <break time="300ms"/> ', x)
              return f"<speak>{x}</speak>"

          # Canonical 4 dictée variants
          # (Pinned voices + per-variant SSML + per-variant default speed)
          VARIANT_CONFIG = {
              "male_default": {
                  "voice_name": "fr-FR-Neural2-D",
                  "default_speed": 1.0,
                  "ssml_func": ssml_default,
              },
              "male_slow": {
                  "voice_name": "fr-FR-Neural2-B",
                  "default_speed": 0.9,
                  "ssml_func": ssml_slow_teacher,
              },
              "female_default": {
                  "voice_name": "fr-FR-Neural2-F",
                  "default_speed": 1.0,
                  "ssml_func": ssml_default,
              },
              "female_rhythm": {
                  "voice_name": "fr-FR-Neural2-C",
                  "default_speed": 1.05,
                  "ssml_func": ssml_rhythm,
              },
          }

          def clamp_rate(x: float) -> float:
              if x < 0.5:
                  return 0.5
              if x > 2.0:
                  return 2.0
              return x

          for variant in variants:
              cfg = VARIANT_CONFIG.get(variant)
              if not cfg:
                  print("Skipping unknown variant:", variant)
                  continue

              voice_param = texttospeech.VoiceSelectionParams(
                  language_code="fr-FR",
                  name=cfg["voice_name"],
              )

              # Use override speeds if provided; otherwise use the per-variant default only
              if speeds_override:
                  speed_list = []
                  for s in speeds_override:
                      try:
                          speed_list.append(clamp_rate(float(s)))
                      except:
                          pass
                  if not speed_list:
                      speed_list = [clamp_rate(float(cfg["default_speed"]))]
              else:
                  speed_list = [clamp_rate(float(cfg["default_speed"]))]

              ssml = cfg["ssml_func"](text)

              for speaking_rate in speed_list:
                  audio_config = texttospeech.AudioConfig(
                      audio_encoding=texttospeech.AudioEncoding.MP3,
                      speaking_rate=speaking_rate,
                  )

                  response = client.synthesize_speech(
                      input=texttospeech.SynthesisInput(ssml=ssml),
                      voice=voice_param,
                      audio_config=audio_config,
                  )

                  safe_variant = variant.replace("/", "_").replace(" ", "_")
                  out_name = f"dictee_{dictee_id}_{safe_variant}_x{speaking_rate}.mp3"
                  with open(out_name, "wb") as f:
                      f.write(response.audio_content)

                  print("Wrote", out_name, "voice=", cfg["voice_name"], "rate=", speaking_rate)

                  # Upload (same contract as before)
                  curl_cmd = [
                      "curl", "-s", "-X", "POST",
                      os.environ["UPLOAD_URL"],
                      "-H", f"Authorization: Bearer {os.environ['UPLOAD_TOKEN']}",
                      "-F", f"dictee_id={dictee_id}",
                      "-F", f"voice={safe_variant}",
                      "-F", f"speed={speaking_rate}",
                      "-F", f"file=@{out_name}",
                  ]
                  print("Uploading", out_name)
                  subprocess.check_call(curl_cmd)

          PY
