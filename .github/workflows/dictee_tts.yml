name: Dictee TTS (Google Cloud - Premium Voices)

on:
  workflow_dispatch:
    inputs:
      dictee_id:
        required: true
        type: string
      text:
        required: true
        type: string
      voices:
        required: false
        default: "male_default,male_slow,female_default,female_slow"
        type: string
        description: "Canonical variant labels (backend sends these)."
      speeds:
        required: false
        default: ""
        type: string
        description: "Optional override CSV (if empty, each variant uses its default speed)."

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-texttospeech

      - name: Generate (Google TTS) + upload (4 distinct premium voices)
        env:
          UPLOAD_URL: ${{ secrets.ALF_TTS_UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.ALF_TTS_UPLOAD_TOKEN }}
          DICTEE_ID: ${{ inputs.dictee_id }}
          TEXT: ${{ inputs.text }}
          VARIANTS: ${{ inputs.voices }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os, re, subprocess
          from google.cloud import texttospeech

          dictee_id = os.environ["DICTEE_ID"]
          text = (os.environ.get("TEXT") or "").strip()
          variants_in = os.environ.get("VARIANTS") or ""
          speeds_in = os.environ.get("SPEEDS") or ""

          if not text:
              raise SystemExit("TEXT input is empty")

          # variants = CSV labels: e.g. male_default,male_slow,female_default,female_slow
          variants = [v.strip() for v in variants_in.split(",") if v.strip()]
          if not variants:
              variants = ["male_default","male_slow","female_default","female_slow"]

          # speeds override (CSV). If empty, we use each variant's default speed only.
          speeds_override = [s.strip() for s in speeds_in.split(",") if s.strip()]

          client = texttospeech.TextToSpeechClient()

          def escape_xml(s: str) -> str:
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def ssml_default(t: str) -> str:
              """Normal speaking - natural pace"""
              return f"<speak>{escape_xml(t)}</speak>"

          def ssml_dictee_pauses(t: str) -> str:
              """Perfect for dictée - strategic pauses after punctuation"""
              x = escape_xml(t)
              # Long pauses after sentences for writing time
              x = re.sub(r'([.!?])\s+', r'\1 <break time="600ms"/> ', x)
              # Medium pauses after commas for breathing room
              x = re.sub(r'([,;:])\s+', r'\1 <break time="350ms"/> ', x)
              return f"<speak>{x}</speak>"

          # ═══════════════════════════════════════════════════════════════
          # 🎯 PREMIUM FRENCH DICTÉE VOICES (4 DISTINCT NEURAL VOICES)
          # ═══════════════════════════════════════════════════════════════
          #
          # Google Cloud French Neural2 voices - carefully selected for:
          # ✓ Natural intonation
          # ✓ Clear pronunciation
          # ✓ Distinct timbres
          # ✓ Perfect for educational dictées
          #
          VARIANT_CONFIG = {
              "male_default": {
                  "voice_name": "fr-FR-Neural2-B",  # Mature male, warm tone, clear
                  "default_speed": 1.0,
                  "ssml_func": ssml_default,
                  "description": "Homme naturel - voix claire"
              },
              "male_slow": {
                  "voice_name": "fr-FR-Neural2-D",  # Different male, authoritative, teacher-like
                  "default_speed": 0.85,
                  "ssml_func": ssml_dictee_pauses,
                  "description": "Homme dictée - voix professorale avec pauses"
              },
              "female_default": {
                  "voice_name": "fr-FR-Neural2-A",  # Young female, energetic, bright
                  "default_speed": 1.0,
                  "ssml_func": ssml_default,
                  "description": "Femme naturelle - voix dynamique"
              },
              "female_slow": {
                  "voice_name": "fr-FR-Neural2-C",  # Mature female, calm, pedagogical
                  "default_speed": 0.85,
                  "ssml_func": ssml_dictee_pauses,
                  "description": "Femme dictée - voix pédagogique avec pauses"
              },
          }

          def clamp_rate(x: float) -> float:
              """Keep speeds within Google TTS safe range"""
              if x < 0.5:
                  return 0.5
              if x > 2.0:
                  return 2.0
              return x

          print("=" * 70)
          print(f"🎯 Generating French Dictée Audio for ID: {dictee_id}")
          print(f"📝 Text: {text[:60]}{'...' if len(text) > 60 else ''}")
          print("=" * 70)

          for variant in variants:
              cfg = VARIANT_CONFIG.get(variant)
              if not cfg:
                  print(f"⚠️  Skipping unknown variant: {variant}")
                  continue

              print(f"\n🎤 Processing variant: {variant}")
              print(f"   Voice: {cfg['voice_name']}")
              print(f"   Description: {cfg['description']}")

              voice_param = texttospeech.VoiceSelectionParams(
                  language_code="fr-FR",
                  name=cfg["voice_name"],
              )

              # Use override speeds if provided; otherwise use the per-variant default only
              if speeds_override:
                  speed_list = []
                  for s in speeds_override:
                      try:
                          speed_list.append(clamp_rate(float(s)))
                      except:
                          pass
                  if not speed_list:
                      speed_list = [clamp_rate(float(cfg["default_speed"]))]
              else:
                  speed_list = [clamp_rate(float(cfg["default_speed"]))]

              ssml = cfg["ssml_func"](text)

              for speaking_rate in speed_list:
                  print(f"   ⚙️  Generating at speed: {speaking_rate}x")
                  
                  audio_config = texttospeech.AudioConfig(
                      audio_encoding=texttospeech.AudioEncoding.MP3,
                      speaking_rate=speaking_rate,
                      pitch=0.0,  # Natural pitch
                  )

                  response = client.synthesize_speech(
                      input=texttospeech.SynthesisInput(ssml=ssml),
                      voice=voice_param,
                      audio_config=audio_config,
                  )

                  safe_variant = variant.replace("/", "_").replace(" ", "_")
                  out_name = f"dictee_{dictee_id}_{safe_variant}_x{speaking_rate}.mp3"
                  
                  with open(out_name, "wb") as f:
                      f.write(response.audio_content)

                  file_size_kb = len(response.audio_content) / 1024
                  print(f"   ✅ Generated: {out_name} ({file_size_kb:.1f} KB)")

                  # Upload to backend
                  curl_cmd = [
                      "curl", "-s", "-X", "POST",
                      os.environ["UPLOAD_URL"],
                      "-H", f"Authorization: Bearer {os.environ['UPLOAD_TOKEN']}",
                      "-F", f"dictee_id={dictee_id}",
                      "-F", f"voice={safe_variant}",
                      "-F", f"speed={speaking_rate}",
                      "-F", f"file=@{out_name}",
                  ]
                  print(f"   📤 Uploading to backend...")
                  result = subprocess.run(curl_cmd, capture_output=True, text=True)
                  
                  if result.returncode == 0:
                      print(f"   ✅ Upload successful!")
                  else:
                      print(f"   ❌ Upload failed: {result.stderr}")
                      raise SystemExit(1)

          print("\n" + "=" * 70)
          print("🎉 All variants generated and uploaded successfully!")
          print("=" * 70)

          PY
