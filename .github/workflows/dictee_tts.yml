name: Dictee TTS (Google Cloud - Premium Voices)

on:
  workflow_dispatch:
    inputs:
      dictee_id:
        required: true
        type: string
      text:
        required: true
        type: string
      voices:
        required: false
        default: "male_default,male_slow,female_default,female_slow"
        type: string
        description: "Canonical variant labels (backend sends these)."
      speeds:
        required: false
        default: ""
        type: string
        description: "Optional override CSV (if empty, each variant uses its default speed)."

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-texttospeech

      - name: Generate (Google TTS) + upload (4 dictée-grade voices)
        env:
          UPLOAD_URL: ${{ secrets.ALF_TTS_UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.ALF_TTS_UPLOAD_TOKEN }}
          DICTEE_ID: ${{ inputs.dictee_id }}
          TEXT: ${{ inputs.text }}
          VARIANTS: ${{ inputs.voices }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set -euxo pipefail

          python - <<'PY'
          import os, re, subprocess
          from google.cloud import texttospeech

          dictee_id = os.environ["DICTEE_ID"]
          text = (os.environ.get("TEXT") or "").strip()
          variants_in = os.environ.get("VARIANTS") or ""
          speeds_in = os.environ.get("SPEEDS") or ""

          if not text:
              raise SystemExit("TEXT input is empty")

          # variants = CSV labels: e.g. male_default,male_slow,female_default,female_slow
          variants = [v.strip() for v in variants_in.split(",") if v.strip()]
          if not variants:
              variants = ["male_default","male_slow","female_default","female_slow"]

          # speeds override (CSV). If empty, we use each variant's default speed only.
          speeds_override = [s.strip() for s in speeds_in.split(",") if s.strip()]

          client = texttospeech.TextToSpeechClient()

          def escape_xml(s: str) -> str:
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def clamp_rate(x: float) -> float:
              # Google TTS allows ~0.25..4.0, but we keep a tight, natural band
              if x < 0.7:
                  return 0.7
              if x > 1.2:
                  return 1.2
              return x

          def normalize_text(t: str) -> str:
              # Keep paragraphs meaningful, avoid weird spacing that kills prosody
              t = t.replace("\r\n", "\n").replace("\r", "\n")
              t = re.sub(r"[ \t]+", " ", t)
              t = re.sub(r"\n{3,}", "\n\n", t)
              return t.strip()

          # -----------------------------
          # SSML: Natural reading (no dictée pauses)
          # -----------------------------
          def ssml_default(t: str) -> str:
              x = escape_xml(normalize_text(t))
              # Sentence/paragraph wrappers improve prosody vs flat <speak>text</speak>
              x = x.replace("\n\n", "</s></p><p><s>")
              x = x.replace("\n", " <break time=\"300ms\"/> ")
              return f"""
          <speak>
            <break time="200ms"/>
            <p><s>{x}</s></p>
            <break time="250ms"/>
          </speak>
          """.strip()

          # -----------------------------
          # SSML: Dictée-grade (teacher-like)
          # - structure (<p><s>) for prosody
          # - smart pauses after punctuation
          # - handles newlines as "writing time"
          # - small lead-in/out for less abrupt playback
          # -----------------------------
          def ssml_dictee_teacher(t: str) -> str:
              x = normalize_text(t)
              x = escape_xml(x)

              # 1) Stronger pause after end-of-sentence (writing time)
              x = re.sub(r'([.!?])\s+', r'\1 <break time="780ms"/> ', x)

              # 2) Gentle pauses for rhythm (teacher breathing)
              x = re.sub(r'([;])\s+',  r'\1 <break time="520ms"/> ', x)
              x = re.sub(r'([,:])\s+', r'\1 <break time="320ms"/> ', x)

              # 3) Paragraph / line breaks = extra writing time
              x = x.replace("\n\n", ' <break time="950ms"/> ')
              x = x.replace("\n", ' <break time="480ms"/> ')

              # 4) Make quotes & parentheses breathe a bit
              x = x.replace("«", "« ")
              x = x.replace("»", " »")
              x = re.sub(r'\)\s*', r') <break time="220ms"/> ', x)

              # 5) Wrap in a gentle prosody tweak (NOT too slow => avoids robotic feel)
              return f"""
          <speak>
            <break time="250ms"/>
            <p><s><prosody rate="95%">{x}</prosody></s></p>
            <break time="350ms"/>
          </speak>
          """.strip()

          # ═══════════════════════════════════════════════════════════════
          # 🎯 4 CANONICAL PATTERNS (distinct voices + distinct behavior)
          # ═══════════════════════════════════════════════════════════════
          # Goal:
          #   - 2 natural "reading" voices (male/female)
          #   - 2 teacher-like dictée voices (male/female) with pauses + better prosody
          #
          # We keep speaking_rate close to natural, and let SSML handle the dictée pacing.
          #
          VARIANT_CONFIG = {
              "male_default": {
                  "voice_name": "fr-FR-Neural2-B",   # warm male
                  "default_speed": 1.00,
                  "pitch": -1.0,
                  "ssml_func": ssml_default,
                  "description": "Homme naturel (lecture fluide)"
              },
              "male_slow": {
                  "voice_name": "fr-FR-Neural2-D",   # authoritative male (teacher-like)
                  "default_speed": 0.98,
                  "pitch": -1.6,
                  "ssml_func": ssml_dictee_teacher,
                  "description": "Homme dictée (pauses + prosodie prof)"
              },
              "female_default": {
                  "voice_name": "fr-FR-Neural2-A",   # bright female
                  "default_speed": 1.00,
                  "pitch": 0.6,
                  "ssml_func": ssml_default,
                  "description": "Femme naturelle (lecture fluide)"
              },
              "female_slow": {
                  "voice_name": "fr-FR-Neural2-C",   # calm female (pedagogical)
                  "default_speed": 0.98,
                  "pitch": 0.2,
                  "ssml_func": ssml_dictee_teacher,
                  "description": "Femme dictée (pauses + prosodie pédagogique)"
              },
          }

          print("=" * 74)
          print(f"🎯 Generating Dictée Audio for ID: {dictee_id}")
          print(f"📝 Text preview: {text[:90]}{'...' if len(text) > 90 else ''}")
          print("=" * 74)

          for variant in variants:
              cfg = VARIANT_CONFIG.get(variant)
              if not cfg:
                  print(f"⚠️  Skipping unknown variant: {variant}")
                  continue

              print(f"\n🎤 Variant: {variant}")
              print(f"   Voice: {cfg['voice_name']}")
              print(f"   Mode : {cfg['description']}")

              voice_param = texttospeech.VoiceSelectionParams(
                  language_code="fr-FR",
                  name=cfg["voice_name"],
              )

              # Use override speeds if provided; otherwise use per-variant default only
              if speeds_override:
                  speed_list = []
                  for s in speeds_override:
                      try:
                          speed_list.append(clamp_rate(float(s)))
                      except:
                          pass
                  if not speed_list:
                      speed_list = [clamp_rate(float(cfg["default_speed"]))]
              else:
                  speed_list = [clamp_rate(float(cfg["default_speed"]))]

              ssml = cfg["ssml_func"](text)

              for speaking_rate in speed_list:
                  safe_variant = variant.replace("/", "_").replace(" ", "_")
                  out_name = f"dictee_{dictee_id}_{safe_variant}_x{speaking_rate}.mp3"

                  print(f"   ⚙️  Synthesize @ {speaking_rate}x → {out_name}")

                  audio_config = texttospeech.AudioConfig(
                      audio_encoding=texttospeech.AudioEncoding.MP3,
                      speaking_rate=speaking_rate,
                      pitch=float(cfg.get("pitch", 0.0)),
                      # Big improvement for real playback (phones/classes):
                      effects_profile_id=["handset-class-device"],
                  )

                  response = client.synthesize_speech(
                      input=texttospeech.SynthesisInput(ssml=ssml),
                      voice=voice_param,
                      audio_config=audio_config,
                  )

                  with open(out_name, "wb") as f:
                      f.write(response.audio_content)

                  file_size_kb = len(response.audio_content) / 1024
                  print(f"   ✅ Generated ({file_size_kb:.1f} KB)")

                  # Upload to backend
                  curl_cmd = [
                      "curl", "-s", "-X", "POST",
                      os.environ["UPLOAD_URL"],
                      "-H", f"Authorization: Bearer {os.environ['UPLOAD_TOKEN']}",
                      "-F", f"dictee_id={dictee_id}",
                      "-F", f"voice={safe_variant}",
                      "-F", f"speed={speaking_rate}",
                      "-F", f"file=@{out_name}",
                  ]
                  print(f"   📤 Uploading...")
                  result = subprocess.run(curl_cmd, capture_output=True, text=True)

                  if result.returncode == 0:
                      print(f"   ✅ Upload OK")
                  else:
                      print(f"   ❌ Upload failed: {result.stderr}")
                      raise SystemExit(1)

          print("\n" + "=" * 74)
          print("🎉 All 4 patterns generated & uploaded (dictée-grade).")
          print("=" * 74)
          PY
